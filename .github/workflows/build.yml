name: Build

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

env:
  PROJECT_TYPE: UEFI
  FORCE_INSTALL: 1
  HAS_OPENSSL_BUILD: 1
  HAS_OPENSSL_W32BUILD: 0
  WERROR: 1

jobs:
  build-macos:
    name: macOS XCODE5
    runs-on: macos-latest
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
      JOB_TYPE: BUILD
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      HOMEBREW_NO_AUTO_UPDATE: 1
    steps:
      - uses: actions/checkout@v6
        with:
         submodules: 'recursive'
         fetch-depth: 0

      - name: Init git submodules (safety)
        run: |
         git submodule sync --recursive || true
         git submodule update --init --recursive || true

      - name: Ensure UDK from dstatstrussia/audk
        run: |
         UDK_PATH="UDK"
         if [ -d "$UDK_PATH" ]; then
           echo "Removing existing $UDK_PATH"
           rm -rf "$UDK_PATH"
         fi
         echo "Cloning dstatstrussia/audk into $UDK_PATH"
         git clone --depth=1 https://github.com/dstatstrussia/audk.git "$UDK_PATH"
         echo "Creating top-level symlinks for build (MdePkg, MdeModulePkg)"
         for p in MdePkg MdeModulePkg; do
           if [ -e "$p" ] || [ -L "$p" ]; then
             echo "Removing stale $p"
             rm -rf "$p"
           fi
           if [ -d "$UDK_PATH/$p" ]; then
             ln -s "$UDK_PATH/$p" "$p"
             echo "Linked $p -> $UDK_PATH/$p"
           else
             echo "Warning: $UDK_PATH/$p not found"
           fi
         done
         echo "Listing linked directories:"
         ls -la MdePkg MdeModulePkg || true

      - name: Install Linux Toolchain
        run: |
          brew tap FiloSottile/homebrew-musl-cross
          brew trust filosottile/musl-cross
          brew install musl-cross

      - name: Install Dependencies
        run: brew install mingw-w64

      - name: CI Bootstrap
        run: |
         export DEVELOPER_DIR=$(xcode-select -p) 2>/dev/null || true
         echo "Using DEVELOPER_DIR=$DEVELOPER_DIR"
         src=$(/usr/bin/curl -LfsS https://raw.githubusercontent.com/acidanthera/ocbuild/master/ci-bootstrap.sh) && eval "$src" || exit 1

      - name: Fix Xcode path
        run: |
         sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer
         unset DEVELOPER_DIR

      - run: ./build_duet.tool
      - run: ./build_oc.tool

      - name: Upload to Artifacts
        uses: actions/upload-artifact@v6
        with:
         name: macOS XCODE5 Artifacts
         path: Binaries/*.zip
      - name: Upload to Release
        if: github.event_name == 'release'
        uses: svenstaro/upload-release-action@04733e069f2d7f7f0b4aebc4fbdbce8613b03ccd
        with:
         repo_token: ${{ secrets.GITHUB_TOKEN }}
         file: Binaries/*.zip
         tag: ${{ github.ref }}
         file_glob: true

  build-linux-clangpdb:
    name: Linux CLANGPDB
    runs-on: ubuntu-24.04
    env:
      TOOLCHAINS: CLANGPDB
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Init git submodules (safety)
        run: |
          git submodule sync --recursive || true
          git submodule update --init --recursive || true

      - name: Apply Docker AppArmor settings
        run: |
          src=$(/usr/bin/curl -LfsS https://raw.githubusercontent.com/acidanthera/ocbuild/master/docker-apparmor.sh) && eval "$src" || exit 1

      - name: Use Docker in rootless mode.
        uses: ScribeMD/rootless-docker@0.2.2

      - name: ./build_duet.tool
        run: docker compose run build-duet

      - name: ./build_oc.tool
        run: docker compose run build-oc

      - name: Upload to Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: Linux CLANGPDB Artifacts
          path: Binaries/*.zip

  build-linux-gcc5:
    name: Linux GCC
    runs-on: ubuntu-24.04
    env:
      TOOLCHAINS: GCC
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Init git submodules (safety)
        run: |
          git submodule sync --recursive || true
          git submodule update --init --recursive || true

      - name: Apply Docker AppArmor settings
        run: |
          src=$(/usr/bin/curl -LfsS https://raw.githubusercontent.com/acidanthera/ocbuild/master/docker-apparmor.sh) && eval "$src" || exit 1

      - name: Use Docker in rootless mode.
        uses: ScribeMD/rootless-docker@0.2.2

      - name: ./build_duet.tool
        run: docker compose run build-duet

      - name: ./build_oc.tool
        run: docker compose run build-oc

      - name: Upload to Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: Linux GCC Artifacts
          path: Binaries/*.zip

  build-linux-clangdwarf:
    name: Linux CLANGDWARF
    runs-on: ubuntu-24.04
    env:
      TOOLCHAINS: CLANGDWARF
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Init git submodules (safety)
        run: |
          git submodule sync --recursive || true
          git submodule update --init --recursive || true

      - name: Apply Docker AppArmor settings
        run: |
          src=$(/usr/bin/curl -LfsS https://raw.githubusercontent.com/acidanthera/ocbuild/master/docker-apparmor.sh) && eval "$src" || exit 1

      - name: Use Docker in rootless mode.
        uses: ScribeMD/rootless-docker@0.2.2

      - name: ./build_duet.tool
        run: docker compose run build-duet

      - name: ./build_oc.tool
        run: docker compose run build-oc

      - name: Upload to Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: Linux CLANGDWARF Artifacts
          path: Binaries/*.zip

  build-linux-docs:
    name: Linux Docs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Init git submodules (safety)
        run: |
          git submodule sync --recursive || true
          git submodule update --init --recursive || true

      - name: Apply Docker AppArmor settings
        run: |
          src=$(/usr/bin/curl -LfsS https://raw.githubusercontent.com/acidanthera/ocbuild/master/docker-apparmor.sh) && eval "$src" || exit 1

      - name: Use Docker in rootless mode.
        uses: ScribeMD/rootless-docker@0.2.2

      - name: Docs
        run: docker compose run build-docs

  build-windows:
    name: Windows VS2022
    runs-on: windows-latest
    env:
      HAS_OPENSSL_BUILD: 0
      CC: gcc
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Init git submodules (safety)
        run: |
          git submodule sync --recursive || true
          git submodule update --init --recursive || true

      - name: Ensure UDK from dstatstrussia/audk
        shell: bash
        run: |
          UDK_PATH="UDK"
          if [ -d "$UDK_PATH" ]; then
          echo "Removing existing $UDK_PATH"
            rm -rf "$UDK_PATH"
          fi
          echo "Cloning dstatstrussia/audk into $UDK_PATH"
          git clone --depth=1 https://github.com/dstatstrussia/audk.git "$UDK_PATH"
           echo "Creating top-level symlinks for build (MdePkg, MdeModulePkg)"
           for p in MdePkg MdeModulePkg; do
             if [ -e "$p" ] || [ -L "$p" ]; then
               echo "Removing stale $p"
               rm -rf "$p"
             fi
             if [ -d "$UDK_PATH/$p" ]; then
               ln -s "$UDK_PATH/$p" "$p"
               echo "Linked $p -> $UDK_PATH/$p"
             else
               echo "Warning: $UDK_PATH/$p not found"
             fi
           done
           echo "Listing linked directories:"
           ls -la MdePkg MdeModulePkg || true

      - uses: actions/setup-python@v6
        id: python
        with:
          python-version: '3.x'

      - uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x86

      - name: Install Dependencies
        shell: cmd
        run: |
          choco install make nasm zip iasl --no-progress
          "%pythonLocation%\python.exe" -m pip install setuptools --quiet --force-reinstall

      - name: CI Bootstrap
        shell: cmd
        env:
          PYTHON_COMMAND: ${{ steps.python.outputs.python-path }}
        run: |
          echo === Python detection ===
          echo PYTHON_COMMAND from setup-python: %PYTHON_COMMAND%
          REM Use Python path directly from setup-python
          set "PYTHON_CMD=%PYTHON_COMMAND%"
          if not exist "%PYTHON_CMD%" (
            echo Error: Python executable not found at %PYTHON_CMD%
            exit /b 1
          )
          echo Python path verified: %PYTHON_CMD%
          REM Run the CI bootstrap script
          for /f "delims=" %%i in ('powershell -Command "[System.Net.ServicePointManager]::SecurityProtocol = [System.Net.ServicePointManager]::SecurityProtocol -bor [System.Net.SecurityProtocolType]::Tls12; (New-Object System.Net.WebClient).DownloadString('https://raw.githubusercontent.com/acidanthera/ocbuild/master/ci-bootstrap.sh')"') do set "src=%%i"
          if errorlevel 1 exit /b 1
          powershell -Command "%src%" || exit /b 1

      - name: Build Duet
        shell: cmd
        run: |
          call .\build_duet.tool

      - name: Build OpenCore
        shell: cmd
        run: |
          call .\build_oc.tool

      - name: Upload to Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: Windows Artifacts
          path: Binaries/*.zip
