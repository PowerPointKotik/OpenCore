name: Build

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

env:
  PROJECT_TYPE: UEFI
  FORCE_INSTALL: 1
  HAS_OPENSSL_BUILD: 1
  HAS_OPENSSL_W32BUILD: 0
  WERROR: 1
  # Optional: set the expected SHA256 of the remote ci-bootstrap.sh to enable verification
  CI_BOOTSTRAP_SHA: ""

jobs:
  build-macos:
    name: macOS XCODE5
    runs-on: macos-latest
    env:
        JOB_TYPE: BUILD
        HOMEBREW_NO_INSTALL_CLEANUP: 1
        HOMEBREW_NO_AUTO_UPDATE: 1
    steps:
      - uses: actions/checkout@v6
        with:
        submodules: 'recursive'
        fetch-depth: 0

      - name: Init git submodules (safety)
        run: |
        git submodule sync --recursive || true
        git submodule update --init --recursive || true

      - name: Ensure UDK from dstatstrussia/audk
        run: |
        UDK_PATH="UDK"
        if [ -d "$UDK_PATH" ]; then
           echo "Removing existing $UDK_PATH"
           rm -rf "$UDK_PATH"
        fi
        echo "Cloning dstatstrussia/audk into $UDK_PATH"
        git clone --depth=1 https://github.com/dstatstrussia/audk.git "$UDK_PATH"
        echo "Creating top-level symlinks for build (MdePkg, MdeModulePkg)"
        for p in MdePkg MdeModulePkg; do
           if [ -e "$p" ] || [ -L "$p" ]; then
             echo "Removing stale $p"
             rm -rf "$p"
           fi
           if [ -d "$UDK_PATH/$p" ]; then
             ln -s "$UDK_PATH/$p" "$p"
             echo "Linked $p -> $UDK_PATH/$p"
           else
             echo "Warning: $UDK_PATH/$p not found"
           fi
        done
        echo "Listing linked directories:"
        ls -la MdePkg MdeModulePkg || true

      - name: Install Linux Toolchain
        run: |
          brew tap FiloSottile/homebrew-musl-cross
          brew trust filosottile/musl-cross
          brew install musl-cross

      - name: Install Dependencies
        run: brew install mingw-w64

      - name: CI Bootstrap
        run: |
         # Universal Xcode/Developer selection for macOS runners
         # Priority order: specific Xcode (optional), Xcode.app, any Xcode-*.app, CommandLineTools
        set -euo pipefail
        SELECTED_DEVELOPER_DIR=""

        echo "Scanning for Xcode and Command Line Tools..."

        CANDIDATES=(
           "/Applications/Xcode_16.4.0.app"
           "/Applications/Xcode.app"
           /Applications/Xcode-*.app
           /Applications/Xcode_*.app
           "/Library/Developer/CommandLineTools"
        )

        for cand in "${CANDIDATES[@]}"; do
           # Expand globs that may not match
           for path in $cand; do
              if [ -d "$path" ]; then
               if [ "$(basename "$path")" = "CommandLineTools" ]; then
                 echo "Selecting Command Line Tools at $path"
                 sudo xcode-select -s "$path" || true
                 SELECTED_DEVELOPER_DIR="$path"
               else
                 echo "Selecting Xcode at $path"
                 # point to the Developer directory inside the .app
                 if [ -d "$path/Contents/Developer" ]; then
                   sudo xcode-select -s "$path/Contents/Developer" || true
                   SELECTED_DEVELOPER_DIR="$path/Contents/Developer"
                 else
                   echo "Found $path but no Contents/Developer — skipping"
                 fi
               fi
               break 2
              fi
          done
        done

         # Fallback: use existing xcode-select -p if it points somewhere usable
        if [ -z "$SELECTED_DEVELOPER_DIR" ]; then
           xs=$(xcode-select -p 2>/dev/null || true)
           if [ -n "$xs" ] && [ -d "$xs" ]; then
             echo "Using existing xcode-select path: $xs"
             SELECTED_DEVELOPER_DIR="$xs"
           fi
        fi

        echo "xcode-select -p returned: $(xcode-select -p 2>/dev/null || true)"

         # Only export DEVELOPER_DIR if we have a valid path. If not, ensure it's unset so tools fallback to system defaults.
        if [ -n "$SELECTED_DEVELOPER_DIR" ] && [ -d "$SELECTED_DEVELOPER_DIR" ]; then
           export DEVELOPER_DIR="$SELECTED_DEVELOPER_DIR"
           echo "Exported DEVELOPER_DIR=$DEVELOPER_DIR"
        else
           echo "WARNING: No Xcode or Command Line Tools found. Continuing without DEVELOPER_DIR — allowing system defaults to be used."
           unset DEVELOPER_DIR || true
        fi

         # Diagnostic logs (non-fatal)
        echo "---- Diagnostics ----"
        xcodebuild -version || true
        clang --version || true
        ls -la /Applications || true
        ls -la /Library/Developer || true
        echo "---------------------"

         # Verify xcrun works; if not, unset DEVELOPER_DIR to allow fallback
        if ! xcrun -v >/dev/null 2>&1; then
           echo "xcrun not functional with current DEVELOPER_DIR. Unsetting DEVELOPER_DIR to fallback to system tools."
           unset DEVELOPER_DIR || true
        fi

         # Download and verify the bootstrap script before execution.
         # Temporarily disable nounset so checks won't abort if CI_BOOTSTRAP_SHA is unset.
        set +e
        set +u
        /usr/bin/curl -LfsS https://raw.githubusercontent.com/acidanthera/ocbuild/master/ci-bootstrap.sh -o ci-bootstrap.sh || true
        if [ -s ci-bootstrap.sh ]; then
           echo "Downloaded ci-bootstrap.sh (size: $(wc -c < ci-bootstrap.sh) bytes)"
           SHASUM=$(shasum -a 256 ci-bootstrap.sh | awk '{print $1}') || SHASUM=""
           echo "Computed SHA256: $SHASUM"

           if [ -n "${CI_BOOTSTRAP_SHA:-}" ]; then
             if [ "$SHASUM" = "$CI_BOOTSTRAP_SHA" ]; then
               echo "SHA matches expected ($CI_BOOTSTRAP_SHA). Executing ci-bootstrap.sh"
               bash ci-bootstrap.sh || echo "ci-bootstrap.sh exited with non-zero status (non-fatal in CI context)"
              else
               echo "ERROR: SHA mismatch for ci-bootstrap.sh (expected $CI_BOOTSTRAP_SHA, got $SHASUM). Skipping execution for safety."
              fi
           else
             echo "CI_BOOTSTRAP_SHA not set — skipping SHA verification. Executing ci-bootstrap.sh (non-fatal)."
             bash ci-bootstrap.sh || echo "ci-bootstrap.sh exited with non-zero status (non-fatal in CI context)"
           fi
        else
           echo "Failed to download ci-bootstrap.sh — continuing with local build steps for diagnostics"
        fi
         # Re-enable strict mode
        set -euo pipefail

      - run: ./build_duet.tool
      - run: ./build_oc.tool

      - name: Upload to Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: macOS XCODE5 Artifacts
          path: Binaries/*.zip
      - name: Upload to Release
        if: github.event_name == 'release'
        uses: svenstaro/upload-release-action@04733e069f2d7f7f0b4aebc4fbdbce8613b03ccd
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: Binaries/*.zip
          tag: ${{ github.ref }}
          file_glob: true

  build-linux-clangpdb:
    name: Linux CLANGPDB
    runs-on: ubuntu-24.04
    env:
        TOOLCHAINS: CLANGPDB
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Init git submodules (safety)
        run: |
          git submodule sync --recursive || true
          git submodule update --init --recursive || true

      - name: Apply Docker AppArmor settings
        run: |
          src=$(/usr/bin/curl -LfsS https://raw.githubusercontent.com/acidanthera/ocbuild/master/docker-apparmor.sh) && eval "$src" || exit 1

      - name: Use Docker in rootless mode.
        uses: ScribeMD/rootless-docker@0.2.2

      - name: Ensure Docker available
        run: |
          echo "Checking Docker availability..."
          docker version || (echo "Docker not available — failing early" && exit 1)
          docker info || true

      - name: ./build_duet.tool
        run: docker compose run build-duet

      - name: ./build_oc.tool
        run: docker compose run build-oc

      - name: Upload to Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: Linux CLANGPDB Artifacts
          path: Binaries/*.zip

  build-linux-gcc5:
    name: Linux GCC
    runs-on: ubuntu-24.04
    env:
        TOOLCHAINS: GCC
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Init git submodules (safety)
        run: |
          git submodule sync --recursive || true
          git submodule update --init --recursive || true

      - name: Apply Docker AppArmor settings
        run: |
          src=$(/usr/bin/curl -LfsS https://raw.githubusercontent.com/acidanthera/ocbuild/master/docker-apparmor.sh) && eval "$src" || exit 1

      - name: Use Docker in rootless mode.
        uses: ScribeMD/rootless-docker@0.2.2

      - name: Ensure Docker available
        run: |
          echo "Checking Docker availability..."
          docker version || (echo "Docker not available — failing early" && exit 1)
          docker info || true

      - name: ./build_duet.tool
        run: docker compose run build-duet

      - name: ./build_oc.tool
        run: docker compose run build-oc

      - name: Upload to Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: Linux GCC Artifacts
          path: Binaries/*.zip

  build-linux-clangdwarf:
    name: Linux CLANGDWARF
    runs-on: ubuntu-24.04
    env:
        TOOLCHAINS: CLANGDWARF
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Init git submodules (safety)
        run: |
          git submodule sync --recursive || true
          git submodule update --init --recursive || true

      - name: Apply Docker AppArmor settings
        run: |
          src=$(/usr/bin/curl -LfsS https://raw.githubusercontent.com/acidanthera/ocbuild/master/docker-apparmor.sh) && eval "$src" || exit 1

      - name: Use Docker in rootless mode.
        uses: ScribeMD/rootless-docker@0.2.2

      - name: Ensure Docker available
        run: |
          echo "Checking Docker availability..."
          docker version || (echo "Docker not available — failing early" && exit 1)
          docker info || true

      - name: ./build_duet.tool
        run: docker compose run build-duet

      - name: ./build_oc.tool
        run: docker compose run build-oc

      - name: Upload to Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: Linux CLANGDWARF Artifacts
          path: Binaries/*.zip

  build-linux-docs:
    name: Linux Docs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Init git submodules (safety)
        run: |
          git submodule sync --recursive || true
          git submodule update --init --recursive || true

      - name: Apply Docker AppArmor settings
        run: |
          src=$(/usr/bin/curl -LfsS https://raw.githubusercontent.com/acidanthera/ocbuild/master/docker-apparmor.sh) && eval "$src" || exit 1

      - name: Use Docker in rootless mode.
        uses: ScribeMD/rootless-docker@0.2.2

      - name: Ensure Docker available
        run: |
          echo "Checking Docker availability..."
          docker version || (echo "Docker not available — failing early" && exit 1)
          docker info || true

      - name: Docs
        run: docker compose run build-docs

  build-windows:
    name: Windows VS2022
    runs-on: windows-latest
    env:
        HAS_OPENSSL_BUILD: 0
        CC: gcc
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Init git submodules (safety)
        run: |
          git submodule sync --recursive || true
          git submodule update --init --recursive || true

      - name: Ensure UDK from dstatstrussia/audk
        shell: bash
        run: |
          UDK_PATH="UDK"
          if [ -d "$UDK_PATH" ]; then
            echo "Removing existing $UDK_PATH"
              rm -rf "$UDK_PATH"
          fi
          echo "Cloning dstatstrussia/audk into $UDK_PATH"
          git clone --depth=1 https://github.com/dstatstrussia/audk.git "$UDK_PATH"
          echo "Creating top-level symlinks for build (MdePkg, MdeModulePkg)"
          for p in MdePkg MdeModulePkg; do
              if [ -e "$p" ] || [ -L "$p" ]; then
                echo "Removing stale $p"
                rm -rf "$p"
              fi
              if [ -d "$UDK_PATH/$p" ]; then
                ln -s "$UDK_PATH/$p" "$p"
                echo "Linked $p -> $UDK_PATH/$p"
              else
                echo "Warning: $UDK_PATH/$p not found"
              fi
          done
          echo "Listing linked directories:"
          ls -la MdePkg MdeModulePkg || true

      - uses: actions/setup-python@v6
        id: python
        with:
          python-version: '3.x'

      - uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x86

      - name: Install Dependencies
        shell: cmd
        run: |
          choco install make nasm zip iasl --no-progress
          "%pythonLocation%\\python.exe" -m pip install setuptools --quiet --force-reinstall

      - name: CI Bootstrap
        shell: bash
        env:
          PYTHON_COMMAND: ${{ steps.python.outputs.python-path }}
        run: |
          set -euo pipefail
          echo "=== Python detection ==="
          echo "PYTHON_COMMAND from setup-python: $PYTHON_COMMAND"

          export PATH="/c/Program Files/NASM:$PATH"
          export PATH="/c/Program Files/iasl:$PATH"

          # Download and run the bootstrap script. Not all bootstrap scripts are Windows-friendly — be tolerant.
          set +e
          curl -LfsS https://raw.githubusercontent.com/acidanthera/ocbuild/master/ci-bootstrap.sh -o ci-bootstrap.sh || true
          if [ -s ci-bootstrap.sh ]; then
            bash ci-bootstrap.sh || echo "ci-bootstrap.sh failed on Windows runner (non-fatal)"
          else
            echo "ci-bootstrap.sh not available — continuing"
          fi
          set -e

      - name: Build Duet
        shell: bash
        run: |
          export PATH="/c/Program Files/NASM:$PATH"
          export PATH="/c/Program Files/iasl:$PATH"
          ./build_duet.tool

      - name: Build OpenCore
        shell: bash
        run: |
          export PATH="/c/Program Files/NASM:$PATH"
          export PATH="/c/Program Files/iasl:$PATH"
          ./build_oc.tool

      - name: Upload to Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: Windows Artifacts
          path: Binaries/*.zip

